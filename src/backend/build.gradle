buildscript {
    ext {
        set('springDependencyManagePluginVersion', "1.0.11.RELEASE")
        set("springBootVersion", "2.4.6")
        set("gradleJooqVersion", "3.0.0")
    }

    def mavenRepoUrl = System.getProperty("mavenRepoUrl")

    if (mavenRepoUrl == null) {
        mavenRepoUrl = System.getenv("mavenRepoUrl")
    }

    if (mavenRepoUrl == null) {
        println "use default maven repo url."
        mavenRepoUrl = MAVEN_REPO_URL
    }
    repositories {
        mavenLocal()
        maven { url mavenRepoUrl }
        maven { url "https://plugins.gradle.org/m2/" }
        mavenCentral()
    }
    dependencies {
        classpath "io.spring.gradle:dependency-management-plugin:$springDependencyManagePluginVersion"
        classpath "nu.studer:gradle-jooq-plugin:$gradleJooqVersion"
        classpath 'org.junit.platform:junit-platform-gradle-plugin:1.1.0'
    }
}

plugins {
    id "java-library"
    id "io.spring.dependency-management" version '1.0.11.RELEASE' apply false
    id 'org.springframework.boot' version '2.4.6' apply false
    id "idea"
    id 'nu.studer.jooq' version '3.0.0'
}

ext {
    // https://mvnrepository.com/artifact/org.springframework/spring-jdbc
    // 强制升级Spring Framework版本以修复CVE-2023-20860和CVE-2024-22243安全漏洞
    // spring-framework.version 属性会覆盖 Spring Boot BOM 中所有 Spring Framework 模块的版本
    set("springVersion", "5.3.32")
    set("spring-framework.version", "5.3.32")
    // https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-dependencies
    set("springBootVersion", "2.4.6")
    // https://mvnrepository.com/artifact/org.springframework.cloud/spring-cloud-dependencies
    set('springCloudVersion', "2020.0.3")
    // 强制升级Spring Security版本以修复CVE-2021-22119、CVE-2022-22976和CVE-2024-22257
    set('springSecurityVersion', "5.7.12")
    // 强制升级SnakeYAML版本以修复CVE-2022-25857和CVE-2022-38749
    set('snakeYamlVersion', "1.33")
    // https://mvnrepository.com/artifact/io.springfox/springfox-swagger-ui
    set('swaggerVersion', "2.9.2")
    set('junitVersion', "5.5.2")
    // https://mvnrepository.com/artifact/org.projectlombok/lombok
    set('lombokVersion', "1.18.10")
    // https://mvnrepository.com/artifact/com.fasterxml.jackson.core/jackson-core
    // 强制升级Jackson版本以修复CVE-2020-36518、CVE-2023-35116、CVE-2022-42003、CVE-2022-42004、CVE-2025-52999等安全漏洞
    set('jacksonVersion', "2.15.4")
    set('jaxrsVersion', "2.0")
    // https://mvnrepository.com/artifact/ch.qos.logback/logback-core
    // 强制升级Logback版本以修复CVE-2023-6378、CVE-2023-6481拒绝服务漏洞
    set('logbackVersion', "1.2.13")
    // https://mvnrepository.com/artifact/org.slf4j/slf4j-api
    set('slf4jVersion', "1.7.30")
    set('servletVersion', "3.0.1")
    // https://mvnrepository.com/artifact/org.apache.commons/commons-lang3
    set('apacheCommonsVersion', "3.9")
    // https://mvnrepository.com/artifact/org.apache.commons/commons-collections4
    set('apacheCommonsCollectionVersion', "4.4")
    // https://mvnrepository.com/artifact/org.apache.commons/commons-pool2
    set('apacheCommonsPoolVersion', "2.8.0")
    set('apacheCommonsCodecVersion', "1.14")
    set('dozerVersion', "5.5.1")
    set('commonsCollectionsVersion', "3.2.2")
    set('jedisVersion', "3.0.1")
    // https://mvnrepository.com/artifact/org.jooq/jooq
    set('jooqVersion', "3.14.8")
    set('h2Version', "1.4.199")
    set('gradleJooqVersion', "2.0.11")
    // https://mvnrepository.com/artifact/org.apache.httpcomponents/httpclient
    set('apacheHttpClientVersion', "4.5.10")
    set('apacheThriftVersion', "0.15.0")
    set('javaxServletVersion', "4.0.1")
    // 强制升级Google Guava版本以修复CVE-2020-8908访问控制错误漏洞和CVE-2023-2976临时文件漏洞
    set('guavaVersion', "32.0.1-jre")
    set('jjwtVersion', "0.9.1")
    set('hibernateValidatorVersion', "6.1.4.Final")
    set('micrometerPrometheusVersion', "1.5.1")
    set('flapdoodleEmbeddedMongdbDBVersion', "2.2.0")
    set('jodaTimeVersion', "2.10.5")
    set('bcprovVersion', "1.64")
    set('reflectionsVersion', "0.9.12")
    // 强制升级RabbitMQ amqp-client版本以修复CVE-2023-46120
    set('rabbitmqAmqpClientVersion', "5.18.0")
    // 强制升级Netty版本以修复CVE-2021-37137、CVE-2021-37136、CVE-2022-24823、CVE-2024-29025、
    // CVE-2025-55163、CVE-2026-42578、CVE-2026-42579、CVE-2026-45674、CVE-2026-47691
    set('nettyVersion', "4.1.135.Final")
    // 单独升级OpenFeign核心模块，避免升级整个Spring Cloud BOM影响其他组件
    set('springCloudOpenFeignVersion', "3.0.5")
    // 强制升级reactor-netty版本以配合Spring Framework 5.3.32
    // Spring Boot 2.4.6默认1.0.7，但5.3.32中ReactorServerHttpRequest调用了hostPort()（1.0.19才引入）
    // 使用Spring Boot 2.7.18配套版本1.0.39，与Spring Framework 5.3.x完全兼容
    set('reactorNettyVersion', "1.0.39")
    set('reactor-netty.version', "1.0.39")
    // 强制升级reactor-core版本以配合reactor-netty 1.0.39
    // reactor-core 3.4.6（Spring Boot 2.4.6默认）缺少MonoSink.contextView()方法
    // 该方法由reactor-netty 1.0.39调用，需升级至3.4.34+（Reactor BOM 2020.0.34+）
    set('reactorCoreVersion', "3.4.34")
    set('reactor-core.version', "3.4.34")
    // 强制升级Apache ZooKeeper版本以修复CVE-2024-23944敏感信息泄露漏洞
    set('zookeeperVersion', "3.8.4")
    // 强制升级Apache Commons Lang版本以修复CVE-2025-48924安全漏洞
    set('apacheCommonsLangVersion', "3.18.0")
    // 强制升级Apache Commons IO版本以修复CVE-2021-29425和CVE-2024-47554漏洞
    set('commonsIOVersion', "2.16.1")
    // 强制升级Apache Commons BeanUtils版本以修复CVE-2014-0114、CVE-2019-10086和CVE-2025-48734漏洞
    set('commonsBeanUtilsVersion', "1.11.0")
    // 强制升级Tomcat版本以修复CVE-2025-52434、CVE-2025-48989、CVE-2025-55752、CVE-2025-53506安全漏洞
    set('tomcatVersion', "9.0.109")
    if (System.getProperty("bkjobVersion")) {
        set('bkjobVersion', System.getProperty("bkjobVersion"))
        println "bkjobVersoin:" + bkjobVersion
    } else {
        set('bkjobVersion', "1.0.0")
        println "bkjobVersoin:" + bkjobVersion
    }
    // Fix Spring Cloud Function Spel表达式注入漏洞(CVE-2022-22963)
    // Fix Spring Cloud Function 拒绝服务漏洞(CVE-2022-22979)
    set('spring-cloud-function.version', "3.2.8")
}

group "com.tencent.bk.job"
version "${bkjobVersion}"

allprojects {
    group "com.tencent.bk.job"
    version "${bkjobVersion}"

    apply plugin: "idea"
    apply plugin: "eclipse"
    apply plugin: "java-library"
    apply plugin: "io.spring.dependency-management"

    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.compilerArgs.add '-parameters'
    }

    def mavenRepoUrl = System.getProperty("mavenRepoUrl")

    if (mavenRepoUrl == null) {
        mavenRepoUrl = System.getenv("mavenRepoUrl")
    }

    if (mavenRepoUrl == null) {
        println "use default maven repo url."
        mavenRepoUrl = MAVEN_REPO_URL
    }

    repositories {
        mavenLocal()
        maven { url mavenRepoUrl }
        maven { url "https://plugins.gradle.org/m2/" }
        mavenCentral()
    }
}

subprojects {
    apply plugin: "java-library"
    apply plugin: "idea"
    apply plugin: "eclipse"
    apply plugin: "io.spring.dependency-management"

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
    }
    tasks.withType(Javadoc).configureEach {
        options.encoding("UTF-8")
    }
    tasks.register("integrationTest", Test) {
        dependsOn test
        useJUnitPlatform()
        include '**/*IntegrationTest.class'
    }

    tasks.register("testAll", Test) {
        useJUnitPlatform()
        testLogging {
            events 'PASSED', 'FAILED', 'SKIPPED'
        }
        include '**/*Test.class'
    }

    dependencyManagement {
        applyMavenExclusions = false
        dependencies {
            imports {
                mavenBom "org.springframework.boot:spring-boot-dependencies:$springBootVersion"
                mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
            }
            // 强制升级Spring Security版本以修复CVE-2021-22119和CVE-2022-22976
            dependencySet(group: "org.springframework.security", version: "$springSecurityVersion") {
                entry "spring-security-core"
                entry "spring-security-web"
                entry "spring-security-config"
                entry "spring-security-crypto"
                entry "spring-security-oauth2-core"
                entry "spring-security-oauth2-client"
                entry "spring-security-oauth2-resource-server"
                entry "spring-security-oauth2-jose"
            }
            // 强制升级SnakeYAML版本以修复CVE-2022-25857和CVE-2022-38749
            dependency "org.yaml:snakeyaml:$snakeYamlVersion"
            // 强制升级RabbitMQ amqp-client版本以修复CVE-2023-46120
            dependency "com.rabbitmq:amqp-client:$rabbitmqAmqpClientVersion"
            // 强制升级reactor-netty版本以配合Spring Framework 5.3.32（hostPort()方法1.0.19引入）
            dependencySet(group: "io.projectreactor.netty", version: "$reactorNettyVersion") {
                entry "reactor-netty"
                entry "reactor-netty-core"
                entry "reactor-netty-http"
            }
            // reactor-netty-tcp / reactor-netty-udp 也需强制覆盖，否则
            // spring-cloud-starter-gateway 可能通过这两个传递引入旧版本
            dependencySet(group: "io.projectreactor.netty", version: "$reactorNettyVersion") {
                entry "reactor-netty-tcp"
                entry "reactor-netty-udp"
            }
            // 强制升级reactor-core以配合reactor-netty 1.0.39
            // MonoSink.contextView()在3.4.6中不存在，3.4.34+才有
            dependencySet(group: "io.projectreactor", version: "$reactorCoreVersion") {
                entry "reactor-core"
                entry "reactor-test"
            }
            // 强制统一Netty模块版本，避免未受管模块回退到Spring Boot BOM中的旧版本
            dependencySet(group: "io.netty", version: "$nettyVersion") {
                entry "netty-all"
                entry "netty-buffer"
                entry "netty-codec"
                entry "netty-codec-dns"
                entry "netty-codec-http"
                entry "netty-codec-http2"
                entry "netty-codec-socks"
                entry "netty-common"
                entry "netty-handler"
                entry "netty-handler-proxy"
                entry "netty-resolver"
                entry "netty-resolver-dns"
                entry "netty-resolver-dns-native-macos"
                entry "netty-transport"
                entry "netty-transport-native-epoll"
                entry "netty-transport-native-unix-common"
            }
            // CVE-2021-22044仅影响OpenFeign核心模块，定向升级以减少变更范围
            dependency "org.springframework.cloud:spring-cloud-openfeign-core:$springCloudOpenFeignVersion"
            // 强制升级Apache ZooKeeper版本以修复CVE-2024-23944敏感信息泄露漏洞
            dependency "org.apache.zookeeper:zookeeper:$zookeeperVersion"
            // 强制升级Apache Commons BeanUtils版本以修复CVE-2014-0114和CVE-2019-10086漏洞
            dependency "commons-beanutils:commons-beanutils:$commonsBeanUtilsVersion"
            // 强制升级Tomcat版本以修复CVE-2025-52434、CVE-2025-48989、CVE-2025-55752、CVE-2025-53506安全漏洞
            dependency "org.apache.tomcat.embed:tomcat-embed-core:$tomcatVersion"
            dependency "org.apache.tomcat.embed:tomcat-embed-el:$tomcatVersion"
            dependency "org.apache.tomcat.embed:tomcat-embed-websocket:$tomcatVersion"
            // 强制升级Commons FileUpload版本以修复CVE-2025-48976拒绝服务漏洞
            dependency "commons-fileupload:commons-fileupload:1.6.0"
            dependency "org.junit.jupiter:junit-jupiter:$junitVersion"
            dependency "org.springframework.boot:spring-boot-starter-web:$springBootVersion"
            dependency "org.springframework.boot:spring-boot-starter-jdbc:$springBootVersion"
            dependency "org.springframework.boot:spring-boot-starter-quartz:$springBootVersion"
            dependency "org.springframework.boot:spring-boot-starter-data-redis:$springBootVersion"
            dependency "org.springframework.boot:spring-boot-starter-validation:$springBootVersion"
            dependency "org.springframework:spring-jdbc:$springVersion"
            dependency "org.springframework:spring-webflux:$springVersion"
            dependency "org.projectlombok:lombok:$lombokVersion"
            dependency "javax.ws.rs:javax.ws.rs-api:$jaxrsVersion"
            dependency "org.slf4j:slf4j-api:$slf4jVersion"
            dependency "io.springfox:springfox-swagger2:$swaggerVersion"
            dependency "io.springfox:springfox-swagger-ui:$swaggerVersion"
            dependency "org.apache.commons:commons-collections4:$apacheCommonsCollectionVersion"
            dependency "org.apache.commons:commons-pool2:$apacheCommonsPoolVersion"
            dependency "net.sf.dozer:dozer:$dozerVersion"
            dependency "commons-collections:commons-collections:$commonsCollectionsVersion"
            dependency "org.jedis:jedis:$jedisVersion"
            dependency "com.h2database:h2:$h2Version"
            dependency "commons-io:commons-io:$commonsIOVersion"
            dependency "commons-codec:commons-codec:$apacheCommonsCodecVersion"
            dependency "javax.servlet:javax.servlet-api:$javaxServletVersion"
            // https://mvnrepository.com/artifact/org.apache.httpcomponents/httpclient
            dependencySet(group: 'org.apache.httpcomponents', version: "$apacheHttpClientVersion") {
                entry "httpclient"
                entry "httpmime"
            }
            // https://mvnrepository.com/artifact/org.apache.thrift/libthrift
            dependency group: 'org.apache.thrift', name: 'libthrift', version: "$apacheThriftVersion"
            dependency group: 'com.google.guava', name: 'guava', version: "$guavaVersion"
            dependency group: 'io.jsonwebtoken', name: 'jjwt', version: "$jjwtVersion"
            dependency "net.sourceforge.jchardet:jchardet:1.0"
            dependency "io.micrometer:micrometer-registry-prometheus:$micrometerPrometheusVersion"
            dependency "de.flapdoodle.embed:de.flapdoodle.embed.mongo:$flapdoodleEmbeddedMongdbDBVersion"
            dependency "joda-time:joda-time:$jodaTimeVersion"
            dependency "org.bouncycastle:bcprov-jdk15on:$bcprovVersion"
            // https://github.com/ronmamo/reflections
            dependency "org.reflections:reflections:$reflectionsVersion"
            dependencySet(group: "org.jooq", version: "$jooqVersion") {
                entry "jooq"
                entry "jooq-codegen"
                entry "jooq-meta"
            }
            // jackson 各模块 group 不同，需分别声明
            dependencySet(group: "com.fasterxml.jackson.core", version: "$jacksonVersion") {
                entry "jackson-core"
                entry "jackson-databind"
                entry "jackson-annotations"
            }
            dependencySet(group: "com.fasterxml.jackson.datatype", version: "$jacksonVersion") {
                entry "jackson-datatype-jsr310"
                entry "jackson-datatype-jdk8"
            }
            dependencySet(group: "com.fasterxml.jackson.module", version: "$jacksonVersion") {
                entry "jackson-module-parameter-names"
            }
            // spring-cloud-function-context 无法单独升级：
            // spring-cloud-stream:3.1.3 强制依赖 function-context 3.1.7，覆盖任何 force/dependencySet
            // 升级需同步升级 spring-cloud-stream 3.2.x，而该版本要求 Spring Boot 2.6.x（暂无法修复）
            dependencySet(group: 'ch.qos.logback', version: "$logbackVersion") {
                entry "logback-core"
                entry "logback-classic"
            }
            dependencySet(group: 'org.apache.commons', version: "$apacheCommonsVersion") {
                entry "commons-lang3"
            }
            dependencySet(group: 'org.hibernate.validator', version: "$hibernateValidatorVersion") {
                entry "hibernate-validator"
            }
        }
    }

    // 使用 resolutionStrategy.force 强制覆盖所有配置中的 reactor-netty 版本
    // dependencySet 只设置 managed version，force 才能保证传递依赖解析时不回退旧版
    configurations.all {
        resolutionStrategy {
            force "io.projectreactor.netty:reactor-netty:${reactorNettyVersion}"
            force "io.projectreactor.netty:reactor-netty-core:${reactorNettyVersion}"
            force "io.projectreactor.netty:reactor-netty-http:${reactorNettyVersion}"
            force "io.projectreactor.netty:reactor-netty-tcp:${reactorNettyVersion}"
            force "io.projectreactor.netty:reactor-netty-udp:${reactorNettyVersion}"
            force "io.projectreactor:reactor-core:${reactorCoreVersion}"
            force "io.projectreactor:reactor-test:${reactorCoreVersion}"
            force "com.fasterxml.jackson.core:jackson-core:${jacksonVersion}"
            force "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
            force "com.fasterxml.jackson.core:jackson-annotations:${jacksonVersion}"
            force "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jacksonVersion}"
            force "com.fasterxml.jackson.datatype:jackson-datatype-jdk8:${jacksonVersion}"
            force "com.fasterxml.jackson.module:jackson-module-parameter-names:${jacksonVersion}"
        }
    }
}
